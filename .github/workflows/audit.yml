name: Smart Contract Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FOUNDRY_PROFILE: ci

jobs:
  # ===========================================================================
  # BUILD & COMPILE
  # ===========================================================================
  build:
    name: Build & Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Dependencies
        run: forge install

      - name: Build
        run: forge build --sizes

  # ===========================================================================
  # STATIC ANALYSIS - SLITHER
  # ===========================================================================
  slither:
    name: Slither Analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: forge build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Slither
        run: |
          pip3 install slither-analyzer
          pip3 install solc-select
          solc-select install 0.8.20
          solc-select use 0.8.20

      - name: Run Slither
        run: |
          slither . \
            --exclude-dependencies \
            --filter-paths "test/|script/|lib/" \
            --checklist \
            > slither_report.md || true

      - name: Upload Slither Report
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: slither_report.md

  # ===========================================================================
  # STATIC ANALYSIS - ADERYN
  # ===========================================================================
  aderyn:
    name: Aderyn Analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: forge build

      - name: Install Aderyn
        run: cargo install aderyn

      - name: Run Aderyn
        run: aderyn . -o aderyn_report.md || true

      - name: Upload Aderyn Report
        uses: actions/upload-artifact@v4
        with:
          name: aderyn-report
          path: aderyn_report.md

  # ===========================================================================
  # TESTING - UNIT & FUZZ
  # ===========================================================================
  test:
    name: Unit & Fuzz Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Unit Tests
        run: forge test -vvv

      - name: Run Fuzz Tests (Extended)
        run: forge test --fuzz-runs 5000

  # ===========================================================================
  # TESTING - INVARIANTS
  # ===========================================================================
  invariants:
    name: Invariant Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Invariant Tests
        run: forge test --match-test "invariant" -vvv || true

  # ===========================================================================
  # COVERAGE
  # ===========================================================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Coverage
        run: forge coverage --report lcov

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info

  # ===========================================================================
  # GAS REPORT
  # ===========================================================================
  gas:
    name: Gas Report
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Gas Report
        run: forge test --gas-report > gas_report.txt

      - name: Upload Gas Report
        uses: actions/upload-artifact@v4
        with:
          name: gas-report
          path: gas_report.txt

  # ===========================================================================
  # FORMAL VERIFICATION - HALMOS
  # ===========================================================================
  halmos:
    name: Halmos Symbolic Tests
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: forge build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Halmos
        run: pip3 install halmos

      - name: Run Halmos
        run: halmos --loop 2 --solver-timeout-branching 10 > halmos_report.txt || true

      - name: Upload Halmos Report
        uses: actions/upload-artifact@v4
        with:
          name: halmos-report
          path: halmos_report.txt
