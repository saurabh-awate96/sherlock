[profile.default]
src = 'evidence'
out = 'out'
libs = ['lib']
test = 'test'
cache = true     # Enable caching to speed up fuzzing
force = false

# SANDBOX HARDENING
# Critical for preventing AI-generated code from escaping the workspace
ffi = false
fs_permissions = [{ access = "read", path = "./"}]
# No write access allowed during tests
# No FFI allowed

# FUZZING LIMITS
[fuzz]
runs = 256
max_test_rejects = 65536
seed = '0x3e8' # Deterministic seed for reproducibility

[invariant]
runs = 64
depth = 15
fail_on_revert = true
